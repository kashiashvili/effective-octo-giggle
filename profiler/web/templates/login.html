{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block outer_class %}{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="container">
    <div style="max-width:440px;margin:0 auto;">
      <div class="auth-card">
        <h2>Sign in</h2>
        <form method="post" novalidate>
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" class="form-control" id="username" name="username"
                   required autofocus autocomplete="username" placeholder="your username">
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   required autocomplete="current-password" placeholder="your password">
          </div>
          <div class="mt-4">
            <button type="submit" class="btn btn-primary btn-block">
              Sign in &rarr;
            </button>
          </div>
        </form>
        <hr class="divider">
        <p class="auth-footer">
          New here? <a href="{{ url_for('auth.register') }}">Create a free account</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
