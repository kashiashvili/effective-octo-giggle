# One-command deployment. Reads secrets from deploy/.env.production (gitignored — create it first,
# see deploy/.env.example). Bring it up with:
#
#   docker compose up -d --build
#   BASE=http://localhost:8080 MT=<Metrics:Token> ./deploy/smoke.sh    # verify
#
# For a public host, terminate TLS in front of this (reverse proxy / platform HTTPS) and set the
# forwarded-headers options so rate limiting and HTTPS redirection see the real client IP and scheme.

services:
  profiler:
    build: .
    image: profiler-web:live
    container_name: profiler
    restart: unless-stopped
    ports:
      - "${PROFILER_PORT:-8080}:8080"
    env_file:
      - deploy/.env.production
    volumes:
      # The SQLite database, the Data Protection key ring AND rolling database snapshots (/data/backups)
      # live here. Keep this volume across redeploys: losing it logs everyone out and (without the same
      # pepper) invalidates fingerprints. Copy the snapshots off-host: `docker cp profiler:/data/backups .`
      - profiler-data:/data
    # The runtime image ships neither wget nor curl, so the probe speaks HTTP over bash's /dev/tcp.
    # /health answers 200 only when the database is reachable.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  profiler-data:
