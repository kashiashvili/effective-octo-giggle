name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Profiler.sln

      - name: Build
        run: dotnet build Profiler.sln --no-restore --configuration Release -warnaserror

      # The suite is fully offline (connectors are stubbed, integration tests use a
      # temporary database), so it needs no secrets and no network access.
      - name: Test
        run: dotnet test Profiler.sln --no-build --configuration Release --verbosity normal
