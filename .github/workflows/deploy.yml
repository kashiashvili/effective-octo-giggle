name: Deploy

# Builds a runnable container image and publishes it to the GitHub Container Registry (GHCR).
# GHCR auth uses the built-in GITHUB_TOKEN, so this needs NO external secrets to run.
#
# The published image is the deployable artifact — run it anywhere with a persistent volume and a
# per-deployment pepper:
#   docker run -d -p 8080:8080 -v profiler-data:/data \
#     -e Fingerprint__Pepper="$(openssl rand -base64 32)" \
#     ghcr.io/<owner>/<repo>:latest
#
# To also push to a real host (Fly.io, Azure, a VPS, …), add a job after `build-and-push` that pulls
# this image and deploys it, gated on that host's secret.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore Profiler.sln
      - run: dotnet build Profiler.sln --no-restore --configuration Release
      # Offline suite — no secrets, no network.
      - run: dotnet test Profiler.sln --no-build --configuration Release

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase the image name — GHCR rejects uppercase, and org/user names can contain it.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
