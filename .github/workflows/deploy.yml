name: Deploy

# Builds a runnable container image and publishes it to the GitHub Container Registry (GHCR).
# GHCR auth uses the built-in GITHUB_TOKEN, so this needs NO external secrets to run.
#
# The published image is the deployable artifact — run it anywhere with a persistent volume and a
# per-deployment pepper:
#   docker run -d -p 8080:8080 -v profiler-data:/data \
#     -e Fingerprint__Pepper="$(openssl rand -base64 32)" \
#     ghcr.io/<owner>/<repo>:latest
#
# To also push to a real host (Fly.io, Azure, a VPS, …), add a job after `build-and-push` that pulls
# this image and deploys it, gated on that host's secret.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore Profiler.sln
      - run: dotnet build Profiler.sln --no-restore --configuration Release -warnaserror
      # Offline suite — no secrets, no network.
      - run: dotnet test Profiler.sln --no-build --configuration Release

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase the image name — GHCR rejects uppercase, and org/user names can contain it.
      - name: Compute image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # Deploy the exact build, not a moving :latest — matches metadata-action's type=sha tag.
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Ships the image just built to Azure App Service. Skipped entirely until AZURE_WEBAPP_NAME is set,
  # so the workflow stays green before Azure exists. Auth is the publish profile (an App Service
  # credential) — no Azure login needed in CI.
  deploy-azure:
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != '' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - name: Deploy container to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ needs.build-and-push.outputs.image_ref }}

      # A container that cannot boot still "deploys" — App Service just serves 503. The app is also
      # configured to refuse to start on a bad ForwardedHeaders/pepper setup, which is exactly the
      # failure this catches. On the free tier the first request also wakes a sleeping app, so allow
      # a generous window.
      - name: Wait for the app to answer
        run: |
          URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL" || echo 000)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && echo "healthy: $URL" && exit 0
            sleep 15
          done
          echo "::error::App never returned 200 — check container logs:"
          echo "  az webapp log tail -g <resource-group> -n ${{ vars.AZURE_WEBAPP_NAME }}"
          exit 1
